<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects & Writing | Radhin Krishna R.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F4F4F4; color: #111111; font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .wireframe-grid { display: grid; gap: 1px; background-color: #111111; border: 1px solid #111111; }
        .wireframe-grid > * { background-color: #F4F4F4; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <main class="max-w-7xl mx-auto wireframe-grid grid-cols-1 md:grid-cols-3 shadow-sm">
        
        <!-- Navigation -->
        <nav class="md:col-span-3 p-6 flex justify-between items-center">
            <a href="index.html" class="font-serif text-2xl hover:italic">RKR.</a>
            <div class="flex space-x-6 text-sm uppercase tracking-widest font-semibold">
                <a href="projects.html" class="underline">Projects</a>
                <a href="resume.html" class="hover:underline">Resume</a>
            </div>
        </nav>

        <!-- Header & Filter Bar -->
        <div class="md:col-span-3 p-10 md:p-16 flex flex-col md:flex-row justify-between md:items-end gap-8">
            <div>
                <h1 class="font-serif text-5xl md:text-7xl mb-6">Selected Works</h1>
                <!-- Category Filter Buttons -->
                <div id="filter-bar" class="flex flex-wrap gap-2">
                    <button onclick="setFilter('All')" class="filter-btn active-filter text-xs uppercase tracking-widest font-bold px-3 py-2 border border-[#111111] bg-[#111111] text-[#F4F4F4]">All (<span id="count-all">0</span>)</button>
                    <button onclick="setFilter('ML & AI')" class="filter-btn text-xs uppercase tracking-widest font-bold px-3 py-2 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">ML & AI</button>
                    <button onclick="setFilter('BI & Tableau')" class="filter-btn text-xs uppercase tracking-widest font-bold px-3 py-2 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">BI & Tableau</button>
                    <button onclick="setFilter('Data & Policy')" class="filter-btn text-xs uppercase tracking-widest font-bold px-3 py-2 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">Data & Policy</button>
                </div>
            </div>
            <svg viewBox="0 0 100 100" class="w-16 h-16 hidden md:block shrink-0" stroke="#111111" stroke-width="2" fill="none">
                <path d="M50 0 C50 40 60 50 100 50 C60 50 50 60 50 100 C50 60 40 50 0 50 C40 50 50 40 50 0 Z" />
            </svg>
        </div>

        <!-- Dynamic Projects Grid Container -->
        <div id="projects-container" class="md:col-span-3 wireframe-grid grid-cols-1 md:grid-cols-3 !border-0"></div>

        <!-- Load More Row (Hidden automatically when all items are shown) -->
        <div id="load-more-row" class="md:col-span-3 p-6 flex justify-center items-center">
            <button onclick="loadMore()" class="text-xs uppercase tracking-widest font-bold px-6 py-3 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">
                Load More Projects +
            </button>
        </div>

        <!-- Dynamic Blogs Grid Container -->
        <div id="blogs-container" class="md:col-span-3 wireframe-grid grid-cols-1 md:grid-cols-3 !border-0"></div>

    </main>

    <!-- Full-Screen Wireframe Reader Modal -->
    <div id="reader-modal" class="fixed inset-0 bg-[#111111]/70 hidden z-50 overflow-y-auto p-4 md:p-10" onclick="closePost()">
        <div class="max-w-3xl mx-auto bg-[#F4F4F4] border border-[#111111] shadow-xl my-8" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-[#111111] flex justify-between items-center sticky top-0 bg-[#F4F4F4] z-10">
                <span id="modal-meta" class="text-xs uppercase tracking-widest font-semibold"></span>
                <button onclick="closePost()" class="text-xs uppercase tracking-widest font-bold px-3 py-1 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">
                    Close [ESC]
                </button>
            </div>
            <div class="p-8 md:p-14">
                <h1 id="modal-title" class="font-serif text-3xl md:text-5xl mb-8 leading-tight"></h1>
                <div id="modal-body" class="space-y-6 font-light text-base leading-relaxed text-[#111111]"></div>
            </div>
        </div>
    </div>

    <script src="projects-data.js"></script>
    <script>
      

        // ==========================================
        // 3. RENDERING & FILTER LOGIC
        // ==========================================
        let currentFilter = 'All';
        let visibleCount = 6; // Shows 6 projects initially; clicking Load More adds 6 more

        function renderProjects() {
            const container = document.getElementById('projects-container');
            const filtered = currentFilter === 'All' 
                ? projectsData 
                : projectsData.filter(p => p.category === currentFilter);
            
            document.getElementById('count-all').textContent = projectsData.length;
            const toShow = filtered.slice(0, visibleCount);

            // Toggle Load More button
            const loadMoreRow = document.getElementById('load-more-row');
            loadMoreRow.style.display = visibleCount >= filtered.length ? 'none' : 'flex';

            let html = toShow.map((p, idx) => `
                <article class="flex flex-col">
                    <a href="${p.link}" target="${p.link.startsWith('http') ? '_blank' : '_self'}" class="h-56 border-b border-[#111111] bg-[#EAEAEA] overflow-hidden flex items-center justify-center relative group cursor-pointer">
                        <span class="text-xs uppercase tracking-widest font-bold z-10 px-3 py-1 bg-[#F4F4F4] border border-[#111111]">${p.actionLabel} &rarr;</span>
                        ${p.image 
                            ? `<img src="${p.image}" alt="${p.title}" class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500">`
                            : `<span class="absolute bottom-3 left-4 text-[10px] uppercase tracking-widest text-gray-500">0${idx + 1} / ${p.category}</span>`
                        }
                    </a>
                    <div class="p-8 flex-grow flex flex-col justify-between">
                        <div>
                            <h2 class="font-serif text-2xl mb-3 leading-tight">${p.title}</h2>
                            <p class="font-light text-sm mb-6 line-clamp-3">${p.description}</p>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-4">
                            ${p.tags.map(t => `<span class="text-[10px] uppercase font-bold tracking-wider px-2 py-1 border border-[#111111]">${t}</span>`).join('')}
                        </div>
                    </div>
                </article>
            `).join('');

            // Add blank filler cells so the 3-column Swiss grid never has missing black boxes
            const remainder = toShow.length % 3;
            if (remainder !== 0) {
                for (let i = 0; i < 3 - remainder; i++) {
                    html += `<div class="hidden md:block bg-[#F4F4F4]"></div>`;
                }
            }
            container.innerHTML = html;
        }

        function setFilter(category) {
            currentFilter = category;
            visibleCount = 6;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isMatch = btn.textContent.startsWith(category);
                btn.classList.toggle('bg-[#111111]', isMatch);
                btn.classList.toggle('text-[#F4F4F4]', isMatch);
            });
            renderProjects();
        }

        function loadMore() {
            visibleCount += 6;
            renderProjects();
        }

        function renderBlogs() {
            const container = document.getElementById('blogs-container');
            let html = blogsData.map(b => `
                <article onclick="openPost('${b.id}')" class="p-8 flex flex-col justify-between cursor-pointer group hover:bg-[#EAEAEA] transition-colors">
                    <div>
                        <div class="flex justify-between items-center text-xs uppercase tracking-widest text-gray-600 mb-4">
                            <span>${b.date}</span>
                            <span>${b.readTime}</span>
                        </div>
                        <h3 class="font-serif text-2xl mb-3 leading-tight group-hover:italic">${b.title}</h3>
                        <p class="font-light text-sm mb-6 line-clamp-3">${b.excerpt}</p>
                    </div>
                    <div class="pt-4 border-t border-[#111111]/20 flex justify-between items-center">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-1 border border-[#111111]">${b.tag}</span>
                        <span class="text-xs uppercase tracking-widest font-bold group-hover:translate-x-1 transition-transform">Read &rarr;</span>
                    </div>
                </article>
            `).join('');

            const remainder = blogsData.length % 3;
            if (remainder !== 0) {
                for (let i = 0; i < 3 - remainder; i++) {
                    html += `<div class="hidden md:block bg-[#F4F4F4]"></div>`;
                }
            }
            container.innerHTML = html;
        }

        function openPost(id) {
            const post = blogsData.find(b => b.id === id);
            if (!post) return;
            document.getElementById('modal-meta').textContent = `${post.date} • ${post.tag} • ${post.readTime}`;
            document.getElementById('modal-title').textContent = post.title;
            document.getElementById('modal-body').innerHTML = post.content;
            document.getElementById('reader-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePost() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePost(); });

        // Initial render
        renderProjects();
        renderBlogs();
    </script>
</body>
</html>
