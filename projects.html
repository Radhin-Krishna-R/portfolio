<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects & Writing | Radhin Krishna R.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F4F4F4; color: #111111; font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .wireframe-grid { display: grid; gap: 1px; background-color: #111111; border: 1px solid #111111; }
        /* Prevents nested .wireframe-grid containers from losing their #111111 gap lines */
        .wireframe-grid > :not(.wireframe-grid) { background-color: #F4F4F4; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <main class="max-w-7xl mx-auto wireframe-grid grid-cols-1 md:grid-cols-3 shadow-sm">
        
        <!-- Navigation -->
        <nav class="md:col-span-3 p-6 flex justify-between items-center">
            <a href="index.html" class="font-serif text-2xl hover:italic">RKR.</a>
            <div class="flex space-x-6 text-sm uppercase tracking-widest font-semibold">
                <a href="projects.html" class="underline underline-offset-4">Projects</a>
                <a href="resume.html" class="hover:underline underline-offset-4">Resume</a>
            </div>
        </nav>

        <!-- Header -->
        <div class="md:col-span-3 px-8 py-12 md:px-14 md:py-16 flex flex-col md:flex-row justify-between md:items-end gap-6">
            <div>
                <p class="text-xs uppercase tracking-[0.2em] text-[#111111]/60 font-medium mb-3">
                    Portfolio Archive &mdash; <span id="project-count">0</span> Projects
                </p>
                <h1 class="font-serif text-5xl md:text-7xl leading-none">Selected Works</h1>
            </div>
            <svg viewBox="0 0 100 100" class="w-14 h-14 hidden md:block shrink-0" stroke="#111111" stroke-width="1.75" fill="none">
                <path d="M50 0 C50 40 60 50 100 50 C60 50 50 60 50 100 C50 60 40 50 0 50 C40 50 50 40 50 0 Z" />
            </svg>
        </div>

        <!-- Dynamic Projects Grid Container (Shows All Projects) -->
        <div id="projects-container" class="md:col-span-3 wireframe-grid grid-cols-1 md:grid-cols-3 !border-0"></div>

       

        <!-- Dynamic Blogs Grid Container -->
        <div id="blogs-container" class="md:col-span-3 wireframe-grid grid-cols-1 md:grid-cols-3 !border-0"></div>

    </main>

    <!-- Full-Screen Wireframe Reader Modal -->
    <div id="reader-modal" class="fixed inset-0 bg-[#111111]/70 hidden z-50 overflow-y-auto p-4 md:p-10" onclick="closePost()">
        <div class="max-w-3xl mx-auto bg-[#F4F4F4] border border-[#111111] shadow-xl my-8" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-[#111111] flex justify-between items-center sticky top-0 bg-[#F4F4F4] z-10">
                <span id="modal-meta" class="text-xs uppercase tracking-widest font-semibold"></span>
                <button onclick="closePost()" class="text-xs uppercase tracking-widest font-bold px-3 py-1 border border-[#111111] hover:bg-[#111111] hover:text-[#F4F4F4] transition-colors">
                    Close [ESC]
                </button>
            </div>
            <div class="p-8 md:p-14">
                <h1 id="modal-title" class="font-serif text-3xl md:text-5xl mb-8 leading-tight"></h1>
                <div id="modal-body" class="space-y-6 font-light text-base leading-relaxed text-[#111111]"></div>
            </div>
        </div>
    </div>

    <script src="projects-data.js"></script>
    <script>
        function renderProjects() {
            const container = document.getElementById('projects-container');
            document.getElementById('project-count').textContent = String(projectsData.length).padStart(2, '0');

            let html = projectsData.map((p, idx) => {
                const target = p.link.startsWith('http') ? '_blank' : '_self';
                const num = String(idx + 1).padStart(2, '0');
                return `
                <article class="flex flex-col group bg-[#F4F4F4] hover:bg-[#EFEFEF] transition-colors duration-300">
                    <a href="${p.link}" target="${target}" class="aspect-[16/10] border-b border-[#111111] bg-white overflow-hidden flex items-center justify-center relative cursor-pointer">
                        ${p.image 
                            ? `<img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover object-left-top group-hover:scale-[1.03] transition-transform duration-500">`
                            : `<span class="text-xs uppercase tracking-widest text-[#111111]/40">${num} / ${p.category}</span>`
                        }
                        <div class="absolute inset-0 bg-[#111111]/0 group-hover:bg-[#111111]/15 transition-colors duration-300 flex items-center justify-center">
                            <span class="opacity-0 translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 text-[11px] uppercase tracking-widest font-bold px-3.5 py-1.5 bg-[#F4F4F4] border border-[#111111] shadow-sm">
                                ${p.actionLabel} &rarr;
                            </span>
                        </div>
                    </a>

                    <div class="p-7 md:p-8 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between text-[10px] uppercase tracking-[0.18em] text-[#111111]/55 font-semibold mb-3">
                                <span>${num} &mdash; ${p.category}</span>
                            </div>
                            <a href="${p.link}" target="${target}" class="block">
                                <h2 class="font-serif text-2xl mb-3 leading-snug group-hover:underline underline-offset-4 decoration-1">${p.title}</h2>
                            </a>
                            <p class="font-light text-sm text-[#111111]/80 leading-relaxed mb-6 line-clamp-3">${p.description}</p>
                        </div>

                        <div class="pt-4 border-t border-[#111111]/15 flex flex-wrap gap-1.5">
                            ${p.tags.map(t => `<span class="text-[10px] uppercase font-medium tracking-wider px-2 py-0.5 border border-[#111111]/25 text-[#111111]/75 bg-[#F4F4F4]">${t}</span>`).join('')}
                        </div>
                    </div>
                </article>
                `;
            }).join('');

            // Add blank filler cells so the 3-column Swiss grid stays balanced
            const remainder = projectsData.length % 3;
            if (remainder !== 0) {
                for (let i = 0; i < 3 - remainder; i++) {
                    html += `<div class="hidden md:block bg-[#F4F4F4]"></div>`;
                }
            }
            container.innerHTML = html;
        }

        function renderBlogs() {
            const container = document.getElementById('blogs-container');
            const header = document.getElementById('blogs-header');

            if (!blogsData || blogsData.length === 0) {
                header.style.display = 'none';
                container.style.display = 'none';
                return;
            }

            let html = blogsData.map(b => `
                <article onclick="openPost('${b.id}')" class="p-8 flex flex-col justify-between cursor-pointer group hover:bg-[#EAEAEA] transition-colors">
                    <div>
                        <div class="flex justify-between items-center text-xs uppercase tracking-widest text-gray-600 mb-4">
                            <span>${b.date}</span>
                            <span>${b.readTime}</span>
                        </div>
                        <h3 class="font-serif text-2xl mb-3 leading-tight group-hover:italic">${b.title}</h3>
                        <p class="font-light text-sm mb-6 line-clamp-3">${b.excerpt}</p>
                    </div>
                    <div class="pt-4 border-t border-[#111111]/20 flex justify-between items-center">
                        <span class="text-[10px] uppercase font-medium tracking-wider px-2 py-0.5 border border-[#111111]/30 text-[#111111]/80">${b.tag}</span>
                        <span class="text-xs uppercase tracking-widest font-bold group-hover:translate-x-1 transition-transform">Read &rarr;</span>
                    </div>
                </article>
            `).join('');

            const remainder = blogsData.length % 3;
            if (remainder !== 0) {
                for (let i = 0; i < 3 - remainder; i++) {
                    html += `<div class="hidden md:block bg-[#F4F4F4]"></div>`;
                }
            }
            container.innerHTML = html;
        }

        function openPost(id) {
            const post = blogsData.find(b => b.id === id);
            if (!post) return;
            document.getElementById('modal-meta').textContent = `${post.date} • ${post.tag} • ${post.readTime}`;
            document.getElementById('modal-title').textContent = post.title;
            document.getElementById('modal-body').innerHTML = post.content;
            document.getElementById('reader-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePost() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePost(); });

        // Initial render
        renderProjects();
        renderBlogs();
    </script>
</body>
</html>
